<body>

    <main>

        <p><a href="senha.html">Esqueceu a Senha?</a></p>
        <p><button type="submit">Entrar </button></p>
        ou

      <form method="get" action="cadastro.html">

      </form>

     <p><button>Audio</button></p>

    </main>
    
    <footer>

    </footer>
