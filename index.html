<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Smart Control 10 </title>
</head>
<body>
    <form method="post">
        <P><label for="email">Digite o Email ou Usuário:</label></P>
        <input type="email" name="email" id="email" required>
        <p><label for="senha">Senha:</label></p>
        <input type="password" name="senha" id="senha">
        <p><button type="submit">Esqueceu a Senha?</button></p>
        <p><button type="submit">Entrar</button></p>
        <p><button type="submit">Criar Conta</button></p>
    </form>
</body>
</html>
